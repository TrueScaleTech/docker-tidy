name: Bug report
description: Something does not work as the README says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not paste real Docker output.** Image, container and volume names
        describe what you run. Replace them with invented ones (`web-1`, `example/app`),
        or attach a small made-up sample of the `docker ... --format json` output.
        For a security problem, use the private link under "Report a vulnerability" instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: The command you ran, or the keys you pressed in the terminal window.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `docker-tidy --version`.
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      description: The "Client" and "Server" versions from `docker version`.
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
