name: Release

# A tag like v0.1.0 builds the package on a clean machine, starts the packaged program
# for real, and creates ONE DRAFT release with the files attached. The draft is checked
# and published by hand: publishing is a decision, not a side effect of pushing a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel and the source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # The version lives in one place, `__version__`. A tag that disagrees with it
      # would publish files named after the wrong release.
      - name: The tag matches the packaged version
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          got="v$(/tmp/smoke/bin/docker-tidy --version | awk '{print $2}')"
          echo "tag=$GITHUB_REF_NAME packaged=$got"
          test "$got" = "$GITHUB_REF_NAME"

      # Start the installed program against the real Docker daemon of the runner. If the
      # packaging lost a module or an entry point, this is where it shows.
      - name: Smoke test the installed program
        run: |
          /tmp/smoke/bin/docker-tidy --help > /dev/null
          /tmp/smoke/bin/docker-tidy report > /dev/null
          /tmp/smoke/bin/docker-tidy report --json | python -c "import json,sys; json.load(sys.stdin)"
          /tmp/smoke/bin/docker-tidy clean > /dev/null

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  draft:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    # The only job that can write to the repository.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # A draft has no tag yet, and GitHub accepts more than one for the same name.
      # Only drafts are removed here; a published release is never touched.
      - name: Remove older drafts for this tag
        run: |
          gh release list --json tagName,isDraft,name --limit 100 \
            | jq -r --arg tag "$TAG" '.[] | select(.isDraft and .tagName == $tag) | .name' \
            | while read -r name; do
                echo "deleting draft: $name"
                gh release delete "$name" --yes
              done

      - name: Create one draft with the files attached
        run: |
          test -f "docs/releases/$TAG.md"   # the notes are written by hand, per release
          gh release create "$TAG" dist/* \
            --draft \
            --verify-tag \
            --title "docker-tidy $TAG" \
            --notes-file "docs/releases/$TAG.md"
