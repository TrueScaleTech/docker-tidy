[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "docker-tidy"
dynamic = ["version"]
description = "See what Docker is keeping that nothing uses, and clean it up safely."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "TrueScaleTech" }]
keywords = ["docker", "cleanup", "containers", "images", "volumes", "terminal", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # The oldest release the test suite has been run against.
    "textual>=8.2",
]

[project.scripts]
docker-tidy = "docker_tidy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/TrueScaleTech/docker-tidy"
Issues = "https://github.com/TrueScaleTech/docker-tidy/issues"

[tool.hatch.version]
path = "src/docker_tidy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_tidy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is how pytest works
]
# The only module that starts a process. The command is always a list of arguments
# and never goes through a shell, which is what the "S" rules are there to enforce.
"src/docker_tidy/runner.py" = [
    "S603", # arguments are a list built by this program, never a shell string
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real Docker daemon; skipped when there is none",
]
